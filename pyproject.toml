[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lugas"
version = "0.3.0"
description = "Lugas (formerly RhetoriLex): free, local, meaning-safe academic paraphrase and editing skill for Indonesian and English"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Reza Prama Arviandi" }]
keywords = ["lugas", "rhetorilex", "indonesian", "bahasa-indonesia", "eyd", "academic-paraphrase", "paraphrasing-tool", "academic-writing", "scientific-writing", "research-writing", "academic-english", "phrasebank", "local-first", "pwa", "agent-skills", "codex", "evidence-calibration", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Text Processing :: Linguistic",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://rezaprama.github.io/Lugas/"
Repository = "https://github.com/rezaprama/Lugas"
Documentation = "https://rezaprama.github.io/Lugas/"
Research = "https://github.com/rezaprama/Lugas/blob/main/docs/discovery-research.md"
Changelog = "https://github.com/rezaprama/Lugas/blob/main/CHANGELOG.md"

[project.scripts]
lugas = "lugas.cli:main"
rhetorilex = "lugas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lugas = ["resources/*.json"]

[tool.unittest]
start-directory = "tests"
