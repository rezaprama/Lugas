name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Reject tracked restricted sources
        run: python .github/scripts/check_tracked_files.py

      - name: Validate canonical data
        run: python scripts/validate_data.py

      - name: Build deterministic data
        run: python scripts/build_data.py

      - name: Build bilingual static site
        run: python docs/build_site.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate bundled skill
        shell: bash
        run: |
          validator="$HOME/.codex/skills/.system/skill-creator/scripts/quick_validate.py"
          if [[ -f "$validator" ]]; then
            python "$validator" skills/lugas
          else
            python .github/scripts/validate_skill.py skills/lugas
          fi

      - name: Build and verify plugin package
        run: |
          python scripts/package_plugin.py --output dist/lugas-plugin.zip
          python scripts/package_plugin.py --verify dist/lugas-plugin.zip

      - name: Verify reproducible rebuilds
        run: python .github/scripts/check_determinism.py
